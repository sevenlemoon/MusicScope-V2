name: publish-desktop-preview
on:
  workflow_dispatch:
    inputs:
      validation_run:
        description: Successful validation run containing the tested desktop package
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VALIDATION_RUN: ${{ inputs.validation_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify the validation run
        shell: bash
        run: |
          [[ "$VALIDATION_RUN" =~ ^[0-9]+$ ]]
          result=$(gh api "repos/$GH_REPO/actions/runs/$VALIDATION_RUN")
          test "$(jq -r .conclusion <<< "$result")" = success
          test "$(jq -r .head_branch <<< "$result")" = master
          test "$(jq -r .path <<< "$result")" = .github/workflows/ci.yml
          echo "RELEASE_SHA=$(jq -r .head_sha <<< "$result")" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Resolve the validated version
        shell: bash
        run: |
          version=$(jq -r .version apps/desktop/package.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          test -f "docs/releases/desktop-$version.md"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Download tested package and verify checksum
        run: |
          gh run download "$VALIDATION_RUN" --name musicscope-windows-desktop --dir assets
          cd assets
          sha256sum -c "MusicScope-$RELEASE_VERSION-windows-x64.zip.sha256"
          jq -e '.status == "passed"' desktop-acceptance/audio-acceptance.json
          jq -e '.status == "passed" and .outbound_network_blocked == true' desktop-acceptance/offline-acceptance.json
          jq -e '.status == "passed" and .ended_state == true' desktop-acceptance/playback-acceptance.json
          preview=$(find . -name desktop-preview.png -type f -print -quit)
          test -n "$preview"
          cp "$preview" desktop-preview.png
      - name: Publish the tested Windows preview
        run: |
          gh release create "v$RELEASE_VERSION" --target "$RELEASE_SHA" --prerelease \
            --title "MusicScope Desktop $RELEASE_VERSION — Windows 桌面预览版" \
            --notes-file "docs/releases/desktop-$RELEASE_VERSION.md" \
            "assets/MusicScope-$RELEASE_VERSION-windows-x64.zip" \
            "assets/MusicScope-$RELEASE_VERSION-windows-x64.zip.sha256" \
            assets/desktop-preview.png
