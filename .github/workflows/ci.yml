name: validation

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            services/netease-api/package-lock.json
      - name: Install uv
        run: python -m pip install uv==0.7.6
      - name: Install API dependencies
        run: uv sync --project apps/api --extra dev --locked
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Install NetEase sidecar dependencies
        run: npm ci --prefix services/netease-api
      - name: Validate
        run: make check
