name: validation

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://musicscope_v2:ci_only@127.0.0.1:5432/musicscope_v2_ci
      POSTGRES_PASSWORD: ci_only
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: musicscope_v2_ci
          POSTGRES_USER: musicscope_v2
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musicscope_v2 -d musicscope_v2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            services/netease-api/package-lock.json
      - name: Install uv
        run: python -m pip install uv==0.7.6
      - name: Install API dependencies
        run: uv sync --project apps/api --extra dev --locked
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Install NetEase sidecar dependencies
        run: npm ci --prefix services/netease-api
      - name: Install audio validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version
      - name: Migrate temporary CI database
        run: cd apps/api && .venv/bin/alembic upgrade head
      - name: Validate
        run: make check
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            services/netease-api/package-lock.json
      - name: Install uv
        run: python -m pip install uv==0.7.6
      - name: Check native launcher syntax and read-only status
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
          }
          ./scripts/test_windows_bootstrap.ps1
          .\scripts\dev.ps1 -Status
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify automatic Node and uv installation
        shell: powershell
        run: |
          . ./scripts/windows-tools.ps1
          Ensure-WindowsRuntimes -ProjectRoot (Join-Path $env:RUNNER_TEMP 'MusicScope runtime test') -ForceLocal
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path (Get-Command node).Source)
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path (Get-Command uv).Source)
      - name: Install Python dependencies from Windows lock
        run: |
          uv sync --project apps/api --extra dev --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --project apps/audio-worker --extra dev --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows one-click FFmpeg setup
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/ensure_ffmpeg.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
          $bin = & ./scripts/ensure_ffmpeg.ps1
          if (-not $bin -or -not (Test-Path (Join-Path $bin 'ffmpeg.exe'))) { throw 'FFmpeg setup failed' }
          if ((& ./scripts/ensure_ffmpeg.ps1) -ne $bin) { throw 'FFmpeg setup is not reusable' }
          & (Join-Path $bin 'ffmpeg.exe') -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $bin 'ffprobe.exe') -version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Run native Python checks
        shell: powershell
        run: |
          Push-Location apps/api
          & ./.venv/Scripts/python.exe -m pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location apps/audio-worker
          & ./.venv/Scripts/python.exe -m pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          & ./apps/api/.venv/Scripts/ruff.exe check apps/api/app apps/api/tests apps/audio-worker/audio_worker apps/audio-worker/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows frontend checks
        shell: powershell
        run: |
          npm ci --prefix apps/web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --prefix services/netease-api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/web run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/web run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/web test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/web run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix services/netease-api test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Start complete Windows application without Docker or WSL
        shell: powershell
        timeout-minutes: 20
        run: ./scripts/test_windows_startup.ps1
      - name: Build and smoke-test Windows desktop application
        shell: powershell
        timeout-minutes: 15
        run: |
          npm ci --prefix apps/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/desktop run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build_desktop.ps1
          $app = Get-ChildItem dist/desktop-*/MusicScope/MusicScope.exe | Select-Object -First 1
          $process = Start-Process $app.FullName -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(600000)) { Stop-Process $process.Id; throw 'Desktop test timed out' }
          if ($process.ExitCode -ne 0) { throw 'Desktop failed to start' }
          $proof = Join-Path $app.DirectoryName 'resources/project/.logs/desktop-smoke-passed'
          if (-not (Test-Path $proof)) { throw 'Desktop did not load Studio' }
      - name: Upload Windows desktop package
        uses: actions/upload-artifact@v4
        with:
          name: musicscope-windows-desktop
          path: |
            dist/MusicScope-*-windows-x64.zip
            dist/MusicScope-*-windows-x64.zip.sha256
            dist/desktop-*/MusicScope/resources/project/.logs/desktop-preview.png
          include-hidden-files: true
      - name: Upload Windows startup diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-logs
          path: |
            .logs/*.log
            dist/desktop-*/MusicScope/resources/project/.logs/*.log
          include-hidden-files: true
