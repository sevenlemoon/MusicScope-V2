name: validation

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://musicscope_v2:ci_only@127.0.0.1:5432/musicscope_v2_ci
      POSTGRES_PASSWORD: ci_only
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: musicscope_v2_ci
          POSTGRES_USER: musicscope_v2
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musicscope_v2 -d musicscope_v2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            services/netease-api/package-lock.json
      - name: Install uv
        run: python -m pip install uv==0.7.6
      - name: Install API dependencies
        run: uv sync --project apps/api --extra dev --locked
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Install NetEase sidecar dependencies
        run: npm ci --prefix services/netease-api
      - name: Install audio validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version
      - name: Migrate temporary CI database
        run: cd apps/api && .venv/bin/alembic upgrade head
      - name: Validate
        run: make check
