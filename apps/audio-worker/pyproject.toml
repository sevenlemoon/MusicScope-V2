[project]
name = "musicscope-audio-worker"
version = "0.1.0"
description = "Isolated local four-stem separation worker for MusicScope V2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "demucs==4.1.0",
  "numpy==1.26.4",
  "psycopg[binary]==3.2.3",
  "pydantic-settings==2.7.1",
  "SQLAlchemy==2.0.36",
  "torch==2.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "ruff==0.9.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "../api"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
