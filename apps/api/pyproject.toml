[project]
name = "musicscope-api"
version = "0.1.0"
description = "MusicScope V2 application API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.14.1",
  "cryptography==46.0.3",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.3",
  "pydantic-settings==2.7.1",
  "SQLAlchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.9.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
